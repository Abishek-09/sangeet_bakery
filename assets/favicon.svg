<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89B5C"/>
      <stop offset="100%" stop-color="#B5651D"/>
    </linearGradient>
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <linearGradient id="chocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B2417"/>
      <stop offset="100%" stop-color="#24140B"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFEE58"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#chocGrad)" stroke="#C89B5C" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#C89B5C" stroke-width="0.8" stroke-dasharray="2 1.5"/>

  <!-- Cake Stand / Base -->
  <path d="M22 51 L42 51 L39 48 L25 48 Z" fill="#C89B5C"/>
  <rect x="30.5" y="47" width="3" height="4" fill="#B5651D"/>
  <ellipse cx="32" cy="47.5" rx="19" ry="2.2" fill="#EAD9C2"/>

  <!-- Cake Base Tier -->
  <rect x="14" y="36" width="36" height="11" rx="2" fill="url(#cakeGrad)"/>
  <!-- Cream Filling Line in Base -->
  <rect x="14" y="41" width="36" height="1.8" fill="#FFF8F0"/>

  <!-- Chocolate Drip over base tier -->
  <path d="M14 36 Q17 39 19 36 Q22 41 25 36 Q28 40 31 36 Q35 41 38 36 Q42 40 45 36 Q48 39 50 36 L50 34 L14 34 Z" fill="url(#chocGrad)"/>

  <!-- Cake Top Tier -->
  <rect x="19" y="24" width="26" height="11" rx="2" fill="url(#cakeGrad)"/>
  <!-- Cream Filling Line in Top Tier -->
  <rect x="19" y="29" width="26" height="1.5" fill="#FFF8F0"/>

  <!-- Frosting swirls on top tier -->
  <path d="M19 24 Q22 28 25 24 Q28 27 32 24 Q36 28 39 24 Q42 27 45 24 L45 22 L19 22 Z" fill="#FFF8F0"/>

  <!-- Cream Puffs / Berries on top -->
  <ellipse cx="23" cy="22" rx="2.5" ry="2" fill="#FFF8F0"/>
  <ellipse cx="29" cy="21.5" rx="2.5" ry="2" fill="#FFF8F0"/>
  <ellipse cx="35" cy="21.5" rx="2.5" ry="2" fill="#FFF8F0"/>
  <ellipse cx="41" cy="22" rx="2.5" ry="2" fill="#FFF8F0"/>

  <!-- Fresh Cherry / Berry -->
  <circle cx="26" cy="20.5" r="2" fill="#D32F2F"/>
  <circle cx="38" cy="20.5" r="2" fill="#D32F2F"/>

  <!-- Birthday Candle in Center -->
  <rect x="31" y="14" width="2" height="7" rx="0.5" fill="#FFF8F0"/>
  <!-- Candle Stripe -->
  <line x1="31" y1="16" x2="33" y2="17.5" stroke="#C89B5C" stroke-width="0.8"/>
  <line x1="31" y1="18.5" x2="33" y2="20" stroke="#C89B5C" stroke-width="0.8"/>
  <!-- Candle Flame -->
  <path d="M32 9 C30.5 11 30.5 13 32 14 C33.5 13 33.5 11 32 9 Z" fill="url(#flameGrad)"/>
</svg>
